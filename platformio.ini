; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
	      secrets.ini
	      local.ini

[node32s]
platform = espressif32
framework = arduino
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
check_tool = clangtidy
monitor_filters = esp32_exception_decoder
build_type = release
extra_scripts = pre:build_svelte.py
lib_deps =
	symlink://../og3
	symlink://../og3x-oled
	symlink://../og3x-shtc3
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit SHTC3 Library@^1.0.0
	adafruit/Adafruit Unified Sensor@^1.1.0
	bakercp/CRC32
	bblanchon/ArduinoJson@^7.0.0
	elims/PsychicMqttClient@^0.2.4
	hoeken/PsychicHttp@^2.1.1
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.2
	Wire
	SPI
	WiFi

lib_ldf_mode = chain
build_flags =
	${local.build_flags}
	'-Wall'
	'-D OTA_PASSWORD="${secrets.otaPassword}"'
	'-D WIFI_OLED'
	'-D AP_PASSWORD="${secrets.apPassword}"'
lib_compat_mode = strict

[usb_node32s]
extends = node32s
upload_protocol = esptool
upload_port = /dev/ttyUSB0

[wifi_node32s]
extends = node32s
upload_protocol = espota
upload_flags =
        '${local.wifi_upload_flags}'
	--auth='${secrets.otaPassword}'

[esp32s3]
extends = node32s
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
	${node32s.build_flags}
	'-D ARDUINO_USB_MODE=1'
	'-D ARDUINO_USB_CDC_ON_BOOT=1'
	'-D BOARD_HAS_PSRAM'
	'-D BOARD_V20=1'

[usb_s3]
extends = esp32s3
upload_protocol = esptool
upload_port = /dev/ttyACM0

[wifi_s3]
extends = esp32s3
upload_protocol = espota
upload_flags =
        '${local.wifi_upload_flags}'
	--auth='${secrets.otaPassword}'
