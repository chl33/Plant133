name: PlatformIO CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: svelte/package-lock.json

      - name: Setup secrets for build
        run: cp secrets.ini.example secrets.ini && cp local.ini.example local.ini

      - name: Install Svelte dependencies
        run: |
          cd svelte
          npm ci

      - name: Run Unit Tests
        run: pio test -e native

      - name: Build Firmware
        run: pio run -e usb_spider -e usb_v20
